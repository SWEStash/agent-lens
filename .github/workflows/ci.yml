name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          # setup-node@v5 auto-detects the packageManager (pnpm) and would try to prime its cache
          # before corepack enables pnpm below — disable it; caching is done manually via actions/cache.
          package-manager-cache: false

      - name: Enable corepack (pnpm pinned via package.json packageManager)
        run: corepack enable

      - name: Locate pnpm store
        id: pnpm
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm.outputs.dir }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Typechecks src AND test/ — the latter via each package's tsconfig.test.json, because their
      # main tsconfig sets rootDir to ./src and cannot include test/. Must follow `pnpm build`: every
      # package except web imports its own ../dist/*.js from tests, so the .d.ts files have to exist.
      # Nothing ran `typecheck` in CI before this step — src was only checked as a side effect of the
      # tsc-based builds, which left packages/cli (built by tsup) unchecked entirely.
      - run: pnpm typecheck

      - run: pnpm test # builds all packages + vitest (incl. corpus-scenarios, determinism, redaction)

      # A new SPA endpoint missing from export-snapshot.mjs (or a snapshotFileKey collision) fails
      # here instead of 404ing the live GitHub Pages demo — only the Pages job ran this before.
      - name: Export the demo snapshot (guards the Pages build)
        run: node scripts/export-snapshot.mjs

      # Exporting successfully only proves the URLs the EXPORTER fetched return 200. This walks the
      # exported snapshot following the links the SPA actually renders and asserts each destination
      # was written — the check that would have caught the "history →" 404 (link passes ?path= alone,
      # exporter only wrote the ?path=&project= key, which is a different hash).
      - name: Check every SPA link resolves to an exported snapshot
        run: node scripts/check-snapshot-links.mjs

      - name: Build the static SPA in snapshot mode (catches snapshot-path breakage the default build misses)
        env:
          VITE_SNAPSHOT: "1"
          VITE_BASE: /agent-lens/
        run: pnpm --filter @agent-lens/web build

      - name: From-tarball smoke (packs the CLI, runs collect→ingest→serve with no repo present)
        run: node scripts/smoke-tarball.mjs

      - name: sqlite3 CLI (for the sandbox harness)
        # `apt-get update` exits non-zero when ANY configured index fails, including the third-party
        # repos the runner image ships (Google Chrome, Microsoft) that this job never reads — a bad
        # Chrome index upstream failed the build with nothing wrong here. So: use the image's own
        # sqlite3 when it has one, and otherwise drop those sources (any format, any filename) before
        # going to the Ubuntu archive for it.
        run: |
          if command -v sqlite3 >/dev/null; then
            sqlite3 --version
            exit 0
          fi
          grep -rlE 'dl\.google\.com|packages\.microsoft\.com' /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sudo rm -f
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y sqlite3

      - name: Sandbox e2e over the committed corpus
        run: bash scripts/sandbox.sh

      - name: Invariant validation over a freshly-ingested corpus DB
        run: |
          cat > /tmp/corpus-sources.json <<'JSON'
          { "sources": [
            { "label": "team-a",    "agent": "claude-code", "configDir": "/unused" },
            { "label": "team-b",    "agent": "claude-code", "configDir": "/unused" },
            { "label": "scenarios", "agent": "claude-code", "configDir": "/unused" }
          ] }
          JSON
          AGENT_LENS_CONFIG=/tmp/corpus-sources.json \
            node packages/ingest/dist/index.js --full --db /tmp/corpus.db --archive test/fixtures/corpus
          node scripts/validate.mjs --db /tmp/corpus.db
